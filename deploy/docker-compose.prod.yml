# Продакшен-контур: Caddy (HTTPS) → app (Next standalone) → db (PostgreSQL). SPEC §8, §10.
# Запуск: docker compose --env-file .env.prod -f deploy/docker-compose.prod.yml up -d --build
# Наружу открыты только 80/443 у Caddy; БД и приложение — во внутренней сети.
name: kompas
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kompas}
      POSTGRES_USER: ${POSTGRES_USER:-kompas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-kompas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kompas}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Задайте BETTER_AUTH_URL в .env.prod}
      VERIFY_SECRET: ${VERIFY_SECRET:?}
      TRUSTED_PROXY: "true" # перед приложением всегда Caddy, он перезаписывает X-Real-IP
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
      AI_ASSISTANT: ${AI_ASSISTANT:-false}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_AUTH_SCHEME: ${AI_AUTH_SCHEME:-Bearer}
    expose: ["3000"]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      KOMPAS_DOMAIN: ${KOMPAS_DOMAIN:?Задайте домен в .env.prod}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../submission-public:/srv/submission:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks: [internal, public]

  # Разовые задачи: docker compose ... run --rm tools [команда]. По умолчанию — миграции.
  tools:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: tools
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kompas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kompas}
      VERIFY_SECRET: ${VERIFY_SECRET:?}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
      NODE_ENV: production
    networks: [internal]

networks:
  internal: {}
  public: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
