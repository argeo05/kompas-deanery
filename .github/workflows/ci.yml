name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Установить gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Скан истории
        run: gitleaks git --redact --no-banner --verbose .

  checks:
    runs-on: ubuntu-latest
    # Матрица изоляции и интеграционные тесты идут на настоящей PostgreSQL с RLS.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kompas
          POSTGRES_USER: kompas
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kompas -d kompas" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://kompas:ci-only-password@localhost:5432/kompas
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + Prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit
        run: pnpm test:unit
      - name: Миграции
        run: pnpm db:migrate
      - name: Security (матрица изоляции)
        run: pnpm test:security
      - name: Integration
        run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Браузер Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E + axe (mobile-360)
        run: pnpm test:e2e --project=mobile-360
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
